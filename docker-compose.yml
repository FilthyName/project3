services:
  api:
    build: .
    container_name: project3_api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./app.db
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app
  redis:
    image: redis:7-alpine
    container_name: project3_redis
volumes:
  sqlite_data: